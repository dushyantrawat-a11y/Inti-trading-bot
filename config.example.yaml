# Copy to config.yaml and adjust for your broker's exact symbol names.
paper:
  enabled: true
  starting_balance: 10000.0
  risk_per_trade_pct: 0.5
  max_open_positions: 3
  max_daily_loss_pct: 2.0
  state_file: paper_state.json

mt5:
  timeout_ms: 10000
  market_depth_enabled: true
  require_market_depth: false

scanner:
  timeframe: M15
  bars: 250
  poll_seconds: 30
  symbols:
    - BTCUSD
    - ETHUSD
  min_tick_volume: 10
  max_spread_points: 1500
  min_depth_volume: 0.0
  min_buy_sell_imbalance: 0.10
  ema_fast: 12
  ema_slow: 26
  atr_period: 14
  stop_atr_multiple: 2.0
  reward_risk_ratio: 1.5
